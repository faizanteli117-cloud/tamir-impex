<script>
const $=s=>document.querySelector(s);
const fm=n=>'₹'+(+n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),r2=n=>Math.round((+n||0)*100)/100,sm=a=>a.reduce((s,x)=>s+x.a,0);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SK='tamir_v1',rd=s=>{try{const d=JSON.parse(s);return d&&Array.isArray(d.items)&&Array.isArray(d.parties)&&Array.isArray(d.bills)&&Array.isArray(d.invs)?d:null}catch(e){return null}};let DB,fromSeed=false;try{DB=rd(localStorage.getItem(SK))}catch(e){}
try{const sd=rd(document.getElementById('seed').textContent);if(sd&&(!DB||(sd._ts||0)>(DB._ts||0))){DB=sd;fromSeed=true}}catch(e){}
const fresh=()=>({parties:[],items:[],bills:[],invs:[],seq:1,nb:0,ni:0,pays:[],np:0,gstin:'',docs:[],rets:[],exps:[],users:[],cnt:{},openCash:0,showCash:true,biz:'My Business'});const fixDB=()=>{if(!DB.companies||!DB.companies.length){DB.companies=[{id:1,name:DB.biz||'My Business',gstin:DB.gstin||'',showBank:true}];DB.defCo=1}{const c0=DB.companies.find(c=>c.id==DB.defCo)||DB.companies[0];DB.defCo=c0.id;DB.biz=c0.name;DB.gstin=c0.gstin||''}DB.pays=DB.pays||[];DB.exps=DB.exps||[];DB.users=DB.users||[];DB.np=DB.np||0;DB.docs=DB.docs||[];DB.rets=DB.rets||[];DB.cnt=DB.cnt||{};DB.openCash=DB.openCash||0;if(DB.showCash===undefined)DB.showCash=true};DB=DB||fresh();fixDB();

const stk=it=>{let q=it.oq||0;DB.bills.forEach(b=>{b.lines.forEach(l=>l.i==it.id&&(q+=l.q));(b.def||[]).forEach(d=>d.i==it.id&&(q-=d.q))});DB.invs.forEach(v=>v.lines.forEach(l=>l.i==it.id&&(q-=(l.pcs??l.q))));DB.rets.forEach(v=>v.lines.forEach(l=>l.i==it.id&&(q+=(l.pcs??l.q))));return q};
const avg=(it,ld)=>{let q=it.oq||0,v=q*(it.oc||0);DB.bills.forEach(b=>{b.lines.forEach(l=>{if(l.i==it.id){q+=l.q;v+=l.q*(l.r+(ld?l.t+l.l:0))}});(b.def||[]).forEach(d=>{const l=b.lines.find(x=>x.i==it.id);if(d.i==it.id&&l){q-=d.q;v-=d.q*(l.r+(ld?l.t+l.l:0))}})});return q?v/q:(it.oc||0)};
const S=b=>{let g=0,tr=0,lb=0;b.lines.forEach(l=>{g+=l.q*l.r;tr+=l.q*l.t;lb+=l.q*l.l});g=r2(g);tr=r2(tr);lb=r2(lb);const ch=r2(tr+lb),pp=r2(sm(b.pay)),pc=r2(sm(b.cp));const df=b.dcr===false?0:r2((b.def||[]).reduce((s,d)=>s+d.q*d.r,0));return{g,tr,lb,ch,pp,pc,df,bp:r2(g-df-pp),bc:r2(ch-pc)}};
const IT=v=>{let sub=0;v.lines.forEach(l=>sub+=l.q*l.rate*(1-(l.d||0)/100));const mode=v.tax||(v.gst===false?'none':'excl');let D=v.dt=='pct'?sub*(+v.dv||0)/100:(+v.dv||0);D=Math.min(Math.max(D,0),sub);let tb=0,tx=0;
v.lines.forEach(l=>{const a=l.q*l.rate*(1-(l.d||0)/100),n=sub?a-D*a/sub:0,g=l.g||0;if(mode=='none')tb+=n;else if(mode=='excl'){tb+=n;tx+=n*g/100}else{const x=n/(1+g/100);tb+=x;tx+=n-x}});
const fr=+v.fr||0,raw=tb+tx+fr,gt=Math.round(raw);return{mode,sub:r2(sub),D:r2(D),tb:r2(tb),g:r2(tx),fr,ro:r2(gt-raw),gt,rec:r2(sm(v.pay)),bal:r2(gt-sm(v.pay))}};
const pname=id=>DB.parties.find(p=>p.id==id)?.name||'Walk-in customer',IN=id=>DB.items.find(i=>i.id==id);
const pb=p=>{let o=0,g=0;DB.bills.forEach(b=>b.party==p.id&&(o+=S(b).bp));DB.invs.forEach(v=>v.party==p.id&&(g+=IT(v).bal));DB.rets.forEach(v=>v.party==p.id&&(g-=IT(v).bal));return{o:r2(o),g:r2(g)}};
const newWB=()=>({id:null,date:today(),pt:{n:'',ty:'Supplier',ph:'',ad:''},lines:[],pay:[],cp:[],f:{},vno:'',def:[],dcr:true,df:{}}),newWI=()=>({date:today(),cn:'',ph:'',gn:'',rows:[],ttype:'gst',tax:'excl',dt:'amt',dv:0,pay:[],kind:'inv',id:null,ref:'',conv:null,co:null});
let WB=newWB(),WI=newWI(),cur='dash',range='Month',q='';
const NAV=[['dash','▦','Dashboard'],['sale','🧾','Sale'],['bills','🛒','Purchases'],['pay','💰','Payments'],['debt','📒','Debtors'],['exp','💸','Expenses'],['rep','📊','Reports'],['items','📦','Items'],['parties','👥','Parties'],['set','⚙','Settings']];
$('#nav').innerHTML=NAV.map(a=>`<button class="nv" data-v="${a[0]}" onclick="go('${a[0]}')"><span>${a[1]}</span><span class="t">${a[2]}</span></button>`).join('');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',3200)}
function dlg(h){$('#dc').innerHTML=h;$('#dlg').style.display='grid'}function cl(){$('#dlg').style.display='none'}
$('#dlg').onclick=e=>{if(e.target.id=='dlg')cl()};
const cf=(m,js)=>dlg(`<b>${m}</b><div class="bar" style="margin-top:12px"><button class="b p" onclick="cl();${js}">Delete</button><button class="b" onclick="cl()">Cancel</button></div>`);
function go(v){if(isEmp()&&['bills','pbill'].includes(v)){toast('This section is only for the admin.');v='dash'}cur=v;q='';if(v=='rep')RP.r=null;if(v=='set')CO=null;$('#gs').value='';document.querySelectorAll('.nv[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==({pbill:'bills',new:'sale',inv:'sale'}[v]||v)));R[v]();if(v=='dash')try{dashBanner()}catch(e){}$('#view').scrollTop=0}
function gsearch(v){q=v.toLowerCase();if(['sale','inv','bills','items','parties','exp'].includes(cur))R[cur]()}
const bz=()=>$('#biz').textContent=DB.biz;
const lowB=()=>{const l=DB.items.filter(i=>stk(i)<i.min);return l.length?`<div class="card am" style="margin-bottom:14px"><b>Low stock reminder:</b> ${l.map(i=>`${esc(i.name)} (${stk(i)} left)`).join(', ')}</div>`:''};
const emp=(m,b)=>`<div class="card" style="text-align:center;padding:32px"><p class="kl">${m}</p>${b||''}</div>`;
const TY=['Factory','Supplier','Dealer','Customer'];
/* ---------- data safety ---------- */
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('tamir_billing',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbSet=(k,v)=>idb().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})).catch(()=>{});
const idbGet=k=>idb().then(d=>new Promise((res,rej)=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})).catch(()=>null);
let FH=null,FS='',fhT;
function fileSave(){if(!FH)return;clearTimeout(fhT);fhT=setTimeout(async()=>{try{if(await FH.queryPermission({mode:'readwrite'})!=='granted'){FS='need';return}const w=await FH.createWritable();await w.write(JSON.stringify(DB));await w.close();FS='ok'}catch(e){FS='err'}},700)}
const save=()=>{DB._ts=Date.now();stampBy();const j=JSON.stringify(DB);try{localStorage.setItem(SK,j)}catch(e){}idbSet('db',j);fileSave();syncPush()};
if(fromSeed)save();
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function bkDown(){if(isEmp())return toast('Only the admin can do this.');DB._bk=Date.now();save();dl('tamir-backup-'+today()+'.json',JSON.stringify(DB,null,1),'application/json');toast('Backup downloaded');if(cur=='set')R.set();if(cur=='dash')R.dash()}
function appDown(){if(isEmp())return toast('Only the admin can do this.');DB._bk=Date.now();save();const c=document.documentElement.cloneNode(true),g=s=>c.querySelector(s);
g('#nav').innerHTML='';g('#view').innerHTML='';g('#dc').innerHTML='';g('#dlg').removeAttribute('style');g('#toast').removeAttribute('style');g('#toast').textContent='';g('#biz').textContent='';g('#sb').removeAttribute('class');g('#pvw').className='';g('#pvw').innerHTML='';c.querySelector('body').removeAttribute('class');
g('#seed').textContent=JSON.stringify(DB).replace(/</g,'\\u003c');
dl('TAMIR_BILLING_with_data.html','<!DOCTYPE html>\n'+c.outerHTML,'text/html');toast('App with your data downloaded');if(cur=='set')R.set();if(cur=='dash')R.dash()}
function applyBk(d){syPause();try{const p=JSON.stringify(DB);localStorage.setItem(SK+'_prev',p);idbSet('prev',p)}catch(e){}d.users=(d.users&&d.users.length)?d.users:DB.users;DB=d;fixDB();save();bz();toast('Data restored');go('dash')}
function bkFile(inp){if(isEmp())return toast('Only the admin can do this.');const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const d=rd(r.result);if(!d)return toast('That file is not a valid backup.');applyBk(d)};r.readAsText(f);inp.value=''}
function recoverPrev(){if(isEmp())return toast('Only the admin can do this.');const d=rd(localStorage.getItem(SK+'_prev'));if(!d)return toast('Nothing to recover.');applyBk(d)}
async function linkFile(){try{const h=await showSaveFilePicker({suggestedName:'tamir-billing-data.json',types:[{description:'Backup file',accept:{'application/json':['.json']}}]});FH=h;await idbSet('fh',h);FS='ok';fileSave();toast('Auto-save file linked');R.set()}catch(e){if(e.name!='AbortError')toast('This browser cannot link a file. Use Download backup instead.')}}
async function reLink(){try{if(await FH.requestPermission({mode:'readwrite'})=='granted'){FS='ok';fileSave();toast('Auto-save reconnected');R.set()}}catch(e){}}
async function unlinkFile(){FH=null;FS='';await idbSet('fh',null);R.set()}
